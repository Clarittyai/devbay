name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # produces an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # A tagged build is the one users install without reading the source, so
      # it does not ship unless the suite passes on the tagged commit.
      - name: verify
        run: |
          make fmt-check
          make vet
          go test -timeout 40m ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
